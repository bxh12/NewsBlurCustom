<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - NewsBlur</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        body.dark-mode {
            background: #1a1a1a;
            color: #f0f0f0;
        }

        .offline-container {
            text-align: center;
            max-width: 500px;
            background: white;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .offline-container {
            background: #2a2a2a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .offline-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        body.dark-mode p {
            color: #aaa;
        }

        .offline-tips {
            text-align: left;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 30px;
            font-size: 14px;
        }

        body.dark-mode .offline-tips {
            background: #333;
        }

        .offline-tips h3 {
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .offline-tips ul {
            list-style: none;
            padding-left: 0;
        }

        .offline-tips li {
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .offline-tips li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #4caf50;
            font-weight: bold;
        }

        .offline-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary {
            background: #3d4e3f;
            color: white;
        }

        .btn-primary:active {
            background: #2d3e2f;
        }

        .btn-secondary {
            background: #ddd;
            color: #333;
        }

        body.dark-mode .btn-secondary {
            background: #444;
            color: #f0f0f0;
        }

        .btn-secondary:active {
            background: #bbb;
        }

        .status {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-size: 12px;
            color: #999;
        }

        body.dark-mode .status {
            border-top-color: #444;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>NewsBlur can't connect to the internet right now, but you can still read your cached stories.</p>

        <div class="offline-tips">
            <h3>What you can do:</h3>
            <ul>
                <li>Read cached stories from recent updates</li>
                <li>Check your starred and saved stories</li>
                <li>Your actions will sync when you're online</li>
            </ul>
        </div>

        <div class="offline-actions">
            <button class="btn-primary" onclick="goToApp()">Go to App</button>
            <button class="btn-secondary" onclick="retryConnection()">Retry</button>
        </div>

        <div class="status">
            <p id="connection-status">Waiting for connection...</p>
        </div>
    </div>

    <script>
        // Detect dark mode preference
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark-mode');
        }

        function goToApp() {
            window.location.href = '/mobile/';
        }

        function retryConnection() {
            fetch('/mobile/', { method: 'HEAD' })
                .then(() => {
                    window.location.href = '/mobile/';
                })
                .catch(() => {
                    document.getElementById('connection-status').textContent = 'Still offline. Try again in a moment.';
                });
        }

        // Monitor connection status
        window.addEventListener('online', () => {
            document.getElementById('connection-status').textContent = '✓ You\'re back online!';
            setTimeout(() => {
                window.location.href = '/mobile/';
            }, 1500);
        });

        window.addEventListener('offline', () => {
            document.getElementById('connection-status').textContent = 'Connection lost.';
        });
    </script>
</body>
</html>
